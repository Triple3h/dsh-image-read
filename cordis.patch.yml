# dsh-image-read v0.5.0 — native host + web client plugin
#
# Single capability: structured vision tool (read_image_mimo) — multi-provider
# failover, schema-validated output, result caching, SSRF protection, key
# redaction, Web UI config card.
#
# Attachment input has moved to dsh-input-enhancement.
#
# Tool name: read_image_mimo
# Configure via the Web UI (Settings → Plugins → Plugin configuration):
# endpoint (baseUrl), model and API key of the primary provider; values left
# blank fall back to this file. baseUrl may omit /chat/completions — it is
# appended automatically.

- insert:
    - id: image-read
      name: 'dsh-image-read'
      config:
        # --- Vision provider chain (multi-provider failover) ---
        # First provider that succeeds wins; failures cascade to the next.
        providers:
          - name: mimo
            baseUrl: 'https://api.xiaomimimo.com/v1'
            apiKey: ''  # Set via Web UI or MIMO_API_KEY env var
            model: 'mimo-v2.5'
          # Example fallback (uncomment and fill in to enable):
          # - name: dashscope
          #   baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
        #   apiKey: ''
        #   model: 'qwen3-vl-plus'
        timeoutMs: 120000
        maxImageDimension: 1024
